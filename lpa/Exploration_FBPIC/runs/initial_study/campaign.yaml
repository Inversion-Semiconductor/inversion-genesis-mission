name: ionization_injection_exploration
# Relative to this file. The source template and all numerical settings are
# fingerprinted so staged data are comparable and reusable.
template_script: ../../../Simulation_FBPIC/runs/initial_sample/ionization_injection_template.py
template_class: IonizationInjectionSimulation
run_root: ../../data/ionization_injection_exploration

# Every physical parameter is persisted for every simulation. Bounds are
# deliberately conservative starting ranges and should be reviewed before a
# production allocation. Parameters without bounds are permanently fixed.
parameters:
  peak_neutral_density_cm3: {nominal: 1.4, lower: 0.4, upper: 3.0, unit: 1e18 cm^-3, linear_scale: 1e18} # nominal density profile values for 3 mm distance, 20 bar pressure, (sim: shape, exp: peak density)
  nitrogen_dopant_fraction: {nominal: 0.005, unit: fraction, description: Fixed nitrogen dopant fraction.}
  density_fwhm_left_m: {nominal: 2.0, lower: 0.8, upper: 5.0, unit: mm, linear_scale: 1e-3}
  density_fwhm_right_m: {nominal: 2.0, lower: 0.8, upper: 5.0, unit: mm, linear_scale: 1e-3}
  density_left_ramp_edge_percent: {nominal: 0.5, lower: 0.05, upper: 1.0, unit: fraction, log_scale: true, description: "Requested fractional 1% location from the left FWHM point toward z=0. The template remaps it as FWHM grows, then derives beta."}
  density_right_ramp_edge_percent: {nominal: 0.5, lower: 0.05, upper: 1.0, unit: fraction, log_scale: true, description: "Requested fractional 1% location from the right FWHM point toward the mirrored right edge. The template remaps it as FWHM grows, then derives beta."}
  density_center_location_m: {nominal: 5.0, unit: mm, linear_scale: 1e-3, description: Fixed profile center at the midpoint of the 10 mm simulation domain.}
  laser_wavelength_m: {nominal: 800e-9, unit: m, description: Fixed laser central wavelength.}
  laser_energy_J: {nominal: 2.5, lower: 1.5, upper: 2.7, unit: J}
  laser_pulse_duration_fwhm_s: {nominal: 38.0, lower: 30.0, upper: 45.0, unit: fs, linear_scale: 1e-15}
  laser_spectral_bandwidth_rad_s: {nominal: auto, description: Transform-limited bandwidth derived by LASY.}
  laser_cep_phase_rad: {nominal: 0.0, lower: -3.141592653589793, upper: 3.141592653589793, unit: rad}
  laser_gdd_relative: {nominal: 0.0, lower: -1.0, upper: 1.0, unit: normalized}
  laser_tod_relative: {nominal: 0.0, lower: -1.0, upper: 1.0, unit: normalized}
  laser_fod_s4: {nominal: 0.0, lower: -1.0e-55, upper: 1.0e-55, unit: s^4}
  laser_spot_size_m: {nominal: 24e-6, lower: 16e-6, upper: 32e-6, unit: m}
  laser_super_gaussian_order: {nominal: 3.0, lower: 2.0, upper: 4.0, unit: dimensionless, description: Continuous transverse super-Gaussian order; 2 is Gaussian.}
  laser_focal_position_m: {nominal: 4.0e-3, lower: 1.0e-3, upper: 6.0e-3, unit: m}
  zernike_astigmatism_2: {nominal: 0.0, lower: -0.5, upper: 0.5}
  zernike_astigmatism_4: {nominal: 0.0, lower: -0.5, upper: 0.5}
  zernike_coma_y: {nominal: 0.0, lower: -0.25, upper: 0.25}
  zernike_coma_x: {nominal: 0.0, lower: -0.25, upper: 0.25}
  zernike_trefoil_y: {nominal: 0.0, lower: -0.75, upper: 0.75}
  zernike_trefoil_x: {nominal: 0.0, lower: -0.75, upper: 0.75}
  zernike_spherical_3: {nominal: 0.0, description: Fixed at zero for this campaign.}
  zernike_astigmatism_6: {nominal: 0.0, description: Outside the initial physics study.}
  zernike_coma_5_y: {nominal: 0.0, description: Outside the initial physics study.}
  zernike_coma_5_x: {nominal: 0.0, description: Outside the initial physics study.}
  zernike_secondary_trefoil_y: {nominal: 0.0, description: Outside the initial physics study.}
  zernike_secondary_trefoil_x: {nominal: 0.0, description: Outside the initial physics study.}

stages:
  stage_1:
    # 200 is the total Stage 1 budget, including the 24 initial points.
    max_evaluations: 200
    initial_design_size: 24
    # Matches the existing single-case FBPIC submission: 8 MPI ranks/GPUs.
    gpus_per_simulation: 8
    total_gpus: 32
    concurrent_simulations: 4
    active_parameters:
      - peak_neutral_density_cm3
      - density_fwhm_left_m
      - laser_energy_J
      - laser_pulse_duration_fwhm_s
      - laser_spot_size_m
      - laser_super_gaussian_order
      - laser_focal_position_m
  stage_2:
    # Includes all Stage 1 data reused at the nominal values of new inputs.
    continuation: true
    max_evaluations: 600
    initial_design_size: 0
    gpus_per_simulation: 8
    total_gpus: 32
    concurrent_simulations: 4
    active_parameters:
      - peak_neutral_density_cm3
      - density_fwhm_left_m
      - density_fwhm_right_m
      - density_left_ramp_edge_percent
      - density_right_ramp_edge_percent
      - laser_energy_J
      - laser_pulse_duration_fwhm_s
      - laser_gdd_relative
      - laser_tod_relative
      - laser_spot_size_m
      - laser_super_gaussian_order
      - laser_focal_position_m
      - zernike_astigmatism_2
      - zernike_coma_y
      - zernike_trefoil_y

analysis:
  exploration_features:
    - total_beam_charge_pc
    - mean_uz
    - cov_x_x
    - cov_y_y
    - cov_uz_uz
  species: nitrogen_electrons
  uz_min: 30.0
  central_fraction: 0.95
  longitudinal_bins: 4
  keep_raw_diagnostics: true

# All numerical choices remain fixed for every stage. Per-run paths are created
# by the executor and are intentionally not listed here.
execution:
  hyperparameters:
    n_order: 32
    gamma_boost: 3.0  # 2.0 perhaps more ideal, but we need the speedup
    nz: 3840  # 5760 perhaps more ideal, but grid is getting very large
    nr: 1280  # 1500 is ideal for the density range, here I compromise
    zmax: 0.0
    zmin: -150.0e-6
    rmax: 480.0e-6
    n_azimuthal_modes: 5
    p_zmin: 0.0
    p_rmax: 90e-6
    p_nz: 2
    p_nr: 2
    p_nt: 15  # 20 perhaps more ideal, but likely too large of a sim
    helium_p_nz: 1
    helium_p_nt: 10
    p_zmax: 10.0e-3
    r_boundary: reflective
    diagnostic_select: {uz: [10.0, None]}
    dump_fields: false
    plot_movies: false
    number_dumps_lab: 2
    write_period: 50
    save_checkpoints: false
    checkpoint_period: 100
    use_restart: false
    track_electrons: false
    random_seed: 0
    lasy_t_start: 0.0
    lasy_antenna_position: 0.0
    laser_polarization: [1, 0]
    laser_n_azimuthal_modes: 5
    laser_num_points: [1200, 600]
    laser_hi_range: 20.0
    laser_center_and_remove_tilt: true
    laser_centering_angles: 72
    ramp_percent_min_high_fwhm: 0.4
  # Use [python] locally. In a NERSC allocation, a libEnsemble worker should
  # supply the slot-aware srun command through this field or its executor.
  launcher: [python]
  timeout_s: 21600
